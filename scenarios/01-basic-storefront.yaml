# 01 Basic storefront: one Gateway with HTTP and HTTPS listeners and three simple routes.
# Healthy. scenarios.sh creates the TLS Secret storefront-tls before it applies this file.
apiVersion: v1
kind: Namespace
metadata:
  name: uc-01-storefront
  labels: {app.kubernetes.io/part-of: snellius-demo, scenario: "01"}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: storefront, namespace: uc-01-storefront}
spec:
  gatewayClassName: kgateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: "*.store.example"
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.store.example"
      tls:
        mode: Terminate
        certificateRefs: [{name: storefront-tls}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: shop, namespace: uc-01-storefront}
spec:
  replicas: 1
  selector: {matchLabels: {app: shop}}
  template:
    metadata: {labels: {app: shop}}
    spec:
      containers:
        - {name: app, image: "mccutchen/go-httpbin:v2.15.0", ports: [{containerPort: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: home, namespace: uc-01-storefront}
spec:
  selector: {app: shop}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: catalog, namespace: uc-01-storefront}
spec:
  selector: {app: shop}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: cart, namespace: uc-01-storefront}
spec:
  selector: {app: shop}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: home, namespace: uc-01-storefront}
spec:
  parentRefs: [{name: storefront}]
  hostnames: [www.store.example]
  rules:
    - backendRefs: [{name: home, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: catalog, namespace: uc-01-storefront}
spec:
  parentRefs: [{name: storefront}]
  hostnames: [catalog.store.example]
  rules:
    - backendRefs: [{name: catalog, port: 80}]
---
# Only on the HTTPS listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: cart, namespace: uc-01-storefront}
spec:
  parentRefs: [{name: storefront, sectionName: https}]
  hostnames: [cart.store.example]
  rules:
    - backendRefs: [{name: cart, port: 80}]
