# 20 Team without access: builds on 19. A team namespace without the access label attaches a route to 19's Gateway.
# Problem: the listener does not admit the namespace, so the route is not accepted. scenarios.sh deploys 19 first.
apiVersion: v1
kind: Namespace
metadata:
  name: uc-20-team-c
  labels: {app.kubernetes.io/part-of: snellius-demo, scenario: "20"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: billing, namespace: uc-20-team-c}
spec:
  replicas: 1
  selector: {matchLabels: {app: billing}}
  template:
    metadata: {labels: {app: billing}}
    spec:
      containers:
        - {name: app, image: "mccutchen/go-httpbin:v2.15.0", ports: [{containerPort: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: billing, namespace: uc-20-team-c}
spec:
  selector: {app: billing}
  ports: [{port: 80, targetPort: 8080}]
---
# The namespace lacks platform-access: "true", which the Gateway's listener requires.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: billing, namespace: uc-20-team-c}
spec:
  parentRefs: [{name: platform, namespace: uc-19-infra}]
  hostnames: [billing.platform.example]
  rules:
    - backendRefs: [{name: billing, port: 80}]
