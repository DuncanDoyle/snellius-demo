# 06 Policies: a TrafficPolicy on the Gateway and one on a route, and a BackendConfigPolicy on a Service.
# Healthy.
apiVersion: v1
kind: Namespace
metadata:
  name: uc-06-policies
  labels: {app.kubernetes.io/part-of: snellius-demo, scenario: "06"}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: edge, namespace: uc-06-policies}
spec:
  gatewayClassName: kgateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: uc-06-policies}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - {name: app, image: "mccutchen/go-httpbin:v2.15.0", ports: [{containerPort: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: uc-06-policies}
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: public, namespace: uc-06-policies}
spec:
  parentRefs: [{name: edge}]
  hostnames: [public.policies.example]
  rules:
    - backendRefs: [{name: api, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: reports, namespace: uc-06-policies}
spec:
  parentRefs: [{name: edge}]
  hostnames: [reports.policies.example]
  rules:
    - backendRefs: [{name: api, port: 80}]
---
# Every route on the Gateway: a local rate limit and a response header.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata: {name: gateway-defaults, namespace: uc-06-policies}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: edge}]
  rateLimit:
    local:
      tokenBucket: {maxTokens: 100, tokensPerFill: 100, fillInterval: 1s}
  headerModifiers:
    response:
      set: [{name: x-served-by, value: api-gateway}]
---
# Slow reports get a longer timeout.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata: {name: reports-timeout, namespace: uc-06-policies}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: reports}]
  timeouts: {request: 60s}
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata: {name: api-connections, namespace: uc-06-policies}
spec:
  targetRefs: [{group: "", kind: Service, name: api}]
  connectTimeout: 5s
