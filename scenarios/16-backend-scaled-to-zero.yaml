# 16 Backend scaled to 0: a route's Service has no ready Pods.
# Problem: requests get a 503. The status stays green, because the config is valid.
apiVersion: v1
kind: Namespace
metadata:
  name: uc-16-scaled-to-zero
  labels: {app.kubernetes.io/part-of: snellius-demo, scenario: "16"}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: web, namespace: uc-16-scaled-to-zero}
spec:
  gatewayClassName: kgateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: search, namespace: uc-16-scaled-to-zero}
spec:
  replicas: 0
  selector: {matchLabels: {app: search}}
  template:
    metadata: {labels: {app: search}}
    spec:
      containers:
        - {name: app, image: "mccutchen/go-httpbin:v2.15.0", ports: [{containerPort: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: search, namespace: uc-16-scaled-to-zero}
spec:
  selector: {app: search}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: search, namespace: uc-16-scaled-to-zero}
spec:
  parentRefs: [{name: web}]
  hostnames: [search.zero.example]
  rules:
    - backendRefs: [{name: search, port: 80}]
