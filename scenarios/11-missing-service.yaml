# 11 Route to a missing Service: a backendRef names a Service that does not exist.
# Problem: the route's ResolvedRefs is False with reason BackendNotFound.
apiVersion: v1
kind: Namespace
metadata:
  name: uc-11-missing-service
  labels: {app.kubernetes.io/part-of: snellius-demo, scenario: "11"}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: shop, namespace: uc-11-missing-service}
spec:
  gatewayClassName: kgateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: orders, namespace: uc-11-missing-service}
spec:
  replicas: 1
  selector: {matchLabels: {app: orders}}
  template:
    metadata: {labels: {app: orders}}
    spec:
      containers:
        - {name: app, image: "mccutchen/go-httpbin:v2.15.0", ports: [{containerPort: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: orders, namespace: uc-11-missing-service}
spec:
  selector: {app: orders}
  ports: [{port: 80, targetPort: 8080}]
---
# Service orders-v2 was never created.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: orders, namespace: uc-11-missing-service}
spec:
  parentRefs: [{name: shop}]
  hostnames: [orders.missing.example]
  rules:
    - backendRefs: [{name: orders-v2, port: 80}]
