# 09 Big Gateway: 70 routes on one Gateway, so the map opens on problems only and lists page.
# Healthy. Every route sends traffic to the same Service.
apiVersion: v1
kind: Namespace
metadata:
  name: uc-09-big
  labels: {app.kubernetes.io/part-of: snellius-demo, scenario: "09"}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: big, namespace: uc-09-big}
spec:
  gatewayClassName: kgateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: app, namespace: uc-09-big}
spec:
  replicas: 1
  selector: {matchLabels: {app: app}}
  template:
    metadata: {labels: {app: app}}
    spec:
      containers:
        - {name: app, image: "mccutchen/go-httpbin:v2.15.0", ports: [{containerPort: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: app, namespace: uc-09-big}
spec:
  selector: {app: app}
  ports: [{port: 80, targetPort: 8080}]
---
{apiVersion: gateway.networking.k8s.io/v1, kind: HTTPRoute, metadata: {name: svc-01, namespace: uc-09-big}, spec: {parentRefs: [{name: big}], hostnames: [svc-01.big.example], rules: [{backendRefs: [{name: app, port: 80}]}]}}
