# 15 Policy target missing: a TrafficPolicy targets an HTTPRoute that does not exist.
# Problem: kgateway 2.5 reports TargetNotFound on the policy.
apiVersion: v1
kind: Namespace
metadata:
  name: uc-15-policy-target
  labels: {app.kubernetes.io/part-of: snellius-demo, scenario: "15"}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: edge, namespace: uc-15-policy-target}
spec:
  gatewayClassName: kgateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: uc-15-policy-target}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - {name: app, image: "mccutchen/go-httpbin:v2.15.0", ports: [{containerPort: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: uc-15-policy-target}
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: checkout, namespace: uc-15-policy-target}
spec:
  parentRefs: [{name: edge}]
  hostnames: [checkout.policy.example]
  rules:
    - backendRefs: [{name: api, port: 80}]
---
# Targets route checkuot, a typo for checkout.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata: {name: checkout-timeout, namespace: uc-15-policy-target}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: checkuot}]
  timeouts: {request: 10s}
