# 07 Backends: kgateway Backend resources next to a plain Service.
# Healthy. The Backends point at Services by DNS name, as an external host would be.
apiVersion: v1
kind: Namespace
metadata:
  name: uc-07-backends
  labels: {app.kubernetes.io/part-of: snellius-demo, scenario: "07"}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: edge, namespace: uc-07-backends}
spec:
  gatewayClassName: kgateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: inventory, namespace: uc-07-backends}
spec:
  replicas: 1
  selector: {matchLabels: {app: inventory}}
  template:
    metadata: {labels: {app: inventory}}
    spec:
      containers:
        - {name: app, image: "mccutchen/go-httpbin:v2.15.0", ports: [{containerPort: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: inventory, namespace: uc-07-backends}
spec:
  selector: {app: inventory}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata: {name: partner-api, namespace: uc-07-backends}
spec:
  type: Static
  static:
    hosts: [{host: inventory.uc-07-backends.svc.cluster.local, port: 80}]
---
# Two hosts: the Backend balances across both.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata: {name: legacy-pool, namespace: uc-07-backends}
spec:
  type: Static
  static:
    hosts:
      - {host: inventory.uc-07-backends.svc.cluster.local, port: 80}
      - {host: inventory.uc-07-backends, port: 80}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: inventory, namespace: uc-07-backends}
spec:
  parentRefs: [{name: edge}]
  hostnames: [inventory.backends.example]
  rules:
    - backendRefs: [{name: inventory, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: partner, namespace: uc-07-backends}
spec:
  parentRefs: [{name: edge}]
  hostnames: [partner.backends.example]
  rules:
    - backendRefs: [{group: gateway.kgateway.dev, kind: Backend, name: partner-api}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: legacy, namespace: uc-07-backends}
spec:
  parentRefs: [{name: edge}]
  hostnames: [legacy.backends.example]
  rules:
    - backendRefs: [{group: gateway.kgateway.dev, kind: Backend, name: legacy-pool}]
