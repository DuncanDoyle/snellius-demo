# 18 Proxy cannot start: the Gateway's GatewayParameters set a proxy image tag that does not exist.
# Problem: the proxy Pod stays in ImagePullBackOff, so the Gateway serves no traffic.
apiVersion: v1
kind: Namespace
metadata:
  name: uc-18-proxy-image
  labels: {app.kubernetes.io/part-of: snellius-demo, scenario: "18"}
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata: {name: broken-image, namespace: uc-18-proxy-image}
spec:
  kube:
    envoyContainer:
      image: {tag: does-not-exist}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: web, namespace: uc-18-proxy-image}
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef: {group: gateway.kgateway.dev, kind: GatewayParameters, name: broken-image}
  listeners:
    - name: http
      port: 80
      protocol: HTTP
