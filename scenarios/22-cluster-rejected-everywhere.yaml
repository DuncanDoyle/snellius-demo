# 22 Cluster rejected everywhere: a BackendConfigPolicy sets a cipher suite that does not exist.
# Problem: kgateway sends clusters to every proxy of the install, so every Gateway's proxies reject it. Deploy it alone.
apiVersion: v1
kind: Namespace
metadata:
  name: uc-22-cluster-nack
  labels: {app.kubernetes.io/part-of: snellius-demo, scenario: "22"}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: web, namespace: uc-22-cluster-nack}
spec:
  gatewayClassName: kgateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ledger, namespace: uc-22-cluster-nack}
spec:
  replicas: 1
  selector: {matchLabels: {app: ledger}}
  template:
    metadata: {labels: {app: ledger}}
    spec:
      containers:
        - {name: app, image: "mccutchen/go-httpbin:v2.15.0", ports: [{containerPort: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: ledger, namespace: uc-22-cluster-nack}
spec:
  selector: {app: ledger}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: ledger, namespace: uc-22-cluster-nack}
spec:
  parentRefs: [{name: web}]
  hostnames: [ledger.nack.example]
  rules:
    - backendRefs: [{name: ledger, port: 80}]
---
# The proxy cannot set up a cipher suite that does not exist, so it rejects the cluster.
# scenarios.sh applies it once the proxies are ready, as a bad change to a running Gateway.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: BackendConfigPolicy
metadata:
  name: ledger-tls
  namespace: uc-22-cluster-nack
  labels: {snellius-demo/apply: after-proxy-ready}
spec:
  targetRefs: [{group: "", kind: Service, name: ledger}]
  tls:
    insecureSkipVerify: true
    parameters: {cipherSuites: [NOT-A-CIPHER]}
